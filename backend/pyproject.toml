[project]
name = "echo-backend"
version = "0.1.0"
description = "FastAPI backend for Echo, the voice-first finance tracker."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0",
  "python-dateutil>=2.9",
  "supabase>=2.10",
  "resend>=2.4",
  "groq>=0.13",
  "langchain-core>=0.3.30",
  "langchain-groq>=0.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Vercel deploys backend/ as its own project (Root Directory: backend).
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
