<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Echo</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, sans-serif; background: #0b0b10; color: #f4f4f6; }
      main { max-width: 320px; padding: 24px; text-align: center; }
      p { color: #a0a0ab; line-height: 1.5; }
      button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 12px;
        background: #7c5cff; color: white; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Echo</h1>
      <p>Check your connection. Your voice agent keeps listening and will retry when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
